<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>日語動詞變化練習</title>

<!--
  這版從零重寫。
  全站只使用「Noto Sans JP」作為主字型，中文與日文不再各自指定字型。
  線上開啟時會由 Google Fonts 載入；若無網路，則退回同系列/系統 CJK 字型。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
 :root{
  --bg:#fff3e1;
  --card:#fffdf9;
  --text:#2d2a26;
  --muted:#7f7468;
  --line:#eadfce;
  --primary:#c96f52;
  --primary-dark:#ad5940;
  --soft:#f6eadc;
  --success-bg:#edf4e8;
  --success-line:#c7dcbf;
  --success-text:#4f6e48;
  --error-bg:#fbeceb;
  --error-line:#e7c1bd;
  --error-text:#9d554d;
  --danger:#a65a50;
  --danger-bg:#f8e8e5;
  --accent:#7a8f9e;
  --accent-soft:#edf1f3;
  --radius:16px;
}

/* 唯一主要字體 */
html,body,button,input{
  font-family:"Noto Sans JP","Noto Sans CJK JP","Noto Sans CJK TC","Yu Gothic","Microsoft JhengHei",sans-serif;
}

*{box-sizing:border-box}

html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-weight:500;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,input{
  -webkit-appearance:none;
  appearance:none;
}

button{
  touch-action:manipulation;
}

.app{
  width:min(900px,100%);
  margin:0 auto;
  padding:28px 18px 48px;
}

.header{
  margin-bottom:20px;
}

.title{
  margin:0;
  font-size:32px;
  line-height:1.25;
  font-weight:900;
  letter-spacing:-.02em;
}

.subtitle{
  margin:6px 0 0;
  color:var(--muted);
  font-size:15px;
  font-weight:500;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 10px 30px rgba(34,46,74,.06);
  padding:24px;
}

.card + .card{
  margin-top:16px;
}

.section-title{
  margin:0 0 12px;
  font-size:19px;
  font-weight:800;
}

.setting-block + .setting-block{
  margin-top:23px;
}

.option-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

.option{
  position:relative;
  display:flex;
  align-items:center;
  min-height:48px;
  padding:10px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  transition:border-color .15s,background .15s,box-shadow .15s;
}

.option:hover{
  border-color:#aeb8ca;
}

.option input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.option:has(input:checked){
  border-color:var(--primary);
  background:#fff0e6;
  box-shadow:0 0 0 1px rgba(53,105,232,.08);
}

.option::before{
  content:"";
  width:17px;
  height:17px;
  flex:0 0 17px;
  margin-right:9px;
  border:1.7px solid #aeb7c7;
  border-radius:50%;
  background:#fff;
}

.option:has(input[type="checkbox"])::before{
  border-radius:5px;
}

.option:has(input:checked)::before{
  border-color:var(--primary);
  background:var(--primary);
  box-shadow:inset 0 0 0 4px #fff;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:24px;
}

.btn{
  border:0;
  min-height:48px;
  padding:11px 18px;
  border-radius:12px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  background:var(--primary);
  color:#fff;
  font-family:inherit;
}

.btn:hover{background:var(--primary-dark)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.secondary{
  background:var(--soft);
  color:#2e394d;
}
.btn.secondary:hover{background:#e5eaf5}
.btn.danger{
  background:#fff1ef;
  color:var(--danger);
}
.btn.danger:hover{background:#ffe6e2}

.note{
  margin:14px 0 0;
  color:var(--muted);
  font-size:13px;
  font-weight:500;
}

.hidden{display:none !important}

.quiz-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:15px;
  font-weight:700;
}

.progress{
  height:9px;
  margin:11px 0 28px;
  border-radius:99px;
  background:#edf0f5;
  overflow:hidden;
}

.progress-bar{
  width:0;
  height:100%;
  background:var(--primary);
  transition:width .2s ease;
}

.question{
  text-align:center;
  padding:4px 4px 0;
}

.question-hint{
  color:var(--muted);
  font-size:14px;
  font-weight:500;
}

.question-verb{
  margin:14px 0 4px;
  font-size:44px;
  line-height:1.3;
  font-weight:900;
  letter-spacing:.01em;
}

.arrow{
  margin:2px 0;
  color:#8d96a6;
  font-size:24px;
  line-height:1.2;
}

.question-form{
  margin-top:3px;
  font-size:26px;
  line-height:1.35;
  font-weight:800;
}

.answer{
  display:block;
  width:min(560px,100%);
  height:58px;
  margin:22px auto 0;
  padding:10px 15px;
  border:2px solid var(--line);
  border-radius:13px;
  outline:none;
  background:#fff;
  color:var(--text);
  text-align:center;
  font-size:22px;
  font-weight:600;
  font-family:inherit;
}

.answer:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(53,105,232,.1);
}

.feedback{
  width:min(650px,100%);
  margin:18px auto 0;
  padding:14px 16px;
  border-radius:13px;
  text-align:left;
  font-size:15px;
  font-weight:500;
}

.feedback.ok{
  background:var(--success-bg);
  border:1px solid var(--success-line);
}

.feedback.bad{
  background:var(--error-bg);
  border:1px solid var(--error-line);
}

.feedback strong{
  font-weight:900;
}

.result-title{
  margin:0;
  font-size:22px;
  font-weight:900;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0 0;
}

.stat{
  padding:16px 10px;
  border-radius:13px;
  background:#f7f8fb;
  text-align:center;
  font-size:14px;
  font-weight:600;
}

.stat-value{
  display:block;
  margin-top:3px;
  font-size:28px;
  line-height:1.2;
  font-weight:900;
}

.wrong-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.wrong-title{
  margin:0;
  font-size:21px;
  font-weight:900;
}

.table-wrap{
  width:100%;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  margin-top:14px;
}

table{
  width:100%;
  min-width:620px;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  padding:12px 9px;
  border-bottom:1px solid #edf0f4;
  text-align:left;
  vertical-align:top;
  font-family:inherit;
  font-weight:500;
}

th{
  color:var(--muted);
  font-weight:700;
}

.badge{
  display:inline-block;
  margin-top:4px;
  padding:2px 7px;
  border-radius:999px;
  background:#eef1f6;
  color:#697386;
  font-size:12px;
  font-weight:600;
}

.empty{
  padding:32px 10px 20px;
  text-align:center;
  color:var(--muted);
  font-weight:600;
}

@media (max-width:700px){
  .level-head{
    margin-bottom:8px;
  }
  .level-toggle{
    min-height:38px;
    padding:7px 6px;
  }

  .app{
    width:100%;
    padding:18px 12px 34px;
  }

  .header{
    margin-bottom:14px;
  }

  .title{
    font-size:25px;
  }

  .subtitle{
    font-size:13px;
    line-height:1.55;
  }

  .card{
    padding:16px;
    border-radius:14px;
  }

  .section-title{
    font-size:18px;
  }

  .option-grid{
    grid-template-columns:1fr 1fr;
  }

  .option{
    min-height:48px;
    padding:10px 11px;
    font-size:14px;
  }

  .quiz-head{
    font-size:14px;
  }

  .question{
    padding-top:0;
  }

  .question-verb{
    margin-top:12px;
    font-size:36px;
  }

  .question-form{
    font-size:22px;
  }

  .answer{
    height:55px;
    margin-top:18px;
    font-size:21px;
  }

  .actions{
    display:grid;
    grid-template-columns:1fr;
    gap:9px;
  }

  .btn{
    width:100%;
  }

  .stats{
    gap:7px;
  }

  .stat{
    padding:13px 5px;
    font-size:13px;
  }

  .stat-value{
    font-size:23px;
  }
}

@media (max-width:390px){
  .option-grid{
    grid-template-columns:1fr;
  }

  .question-verb{
    font-size:32px;
  }

  .question-form{
    font-size:20px;
  }

  .stats{
    grid-template-columns:1fr;
  }
}

.level-block + .level-block{
  margin-top:18px;
}

.level-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}

.level-name{
  display:inline-flex;
  align-items:center;
  min-height:30px;
  padding:3px 10px;
  border-radius:999px;
  font-size:14px;
  font-weight:900;
  letter-spacing:.02em;
}

.level-name.n5{
  background:#f7e7cf;
  color:#9a5f32;
}

.level-name.n4{
  background:#e7edf2;
  color:#586f7d;
}

.level-toggle{
  border:0;
  background:transparent;
  color:var(--primary);
  font-family:inherit;
  font-size:13px;
  font-weight:800;
  padding:5px 4px;
  cursor:pointer;
}

.level-toggle:hover{
  color:var(--primary-dark);
  text-decoration:underline;
}


/* ===== 普通形・丁寧形模組 ===== */
.mode-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:4px;
}

.mode-card{
  padding:20px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fffaf2;
  cursor:pointer;
  text-align:left;
  transition:transform .15s, border-color .15s, box-shadow .15s, background .15s;
}

.mode-card:hover{
  transform:translateY(-1px);
  border-color:#d2a07d;
  box-shadow:0 6px 18px rgba(75,57,38,.07);
}

.mode-card.verb{
  background:#fff3e8;
  border-color:#eed7c3;
}

.mode-card.polite{
  background:#eef3f5;
  border-color:#d8e1e5;
}

.mode-title{
  margin:0;
  font-size:20px;
  font-weight:900;
}

.mode-desc{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
  font-weight:500;
}

.compact-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

.small-select{
  min-height:45px;
}

.level-filter{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:4px;
}

.filter-pill{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:8px 12px;
  color:#6b6258;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.filter-pill.active{
  background:#f7e9d8;
  border-color:#d8a878;
  color:#8c5e32;
}

@media (max-width:700px){
  .mode-grid{
    grid-template-columns:1fr;
    gap:10px;
  }
}


.mode-switch{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:16px;
}

.mode-tab{
  min-height:48px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:#5f5147;
  font-family:inherit;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.mode-tab.active-verb{
  background:#fff0e6;
  border-color:#d9a17e;
  color:#9a5f32;
}

.mode-tab.active-polite{
  background:#edf1f3;
  border-color:#c8d5db;
  color:#586f7d;
}

.module-desc{
  margin:0 0 12px;
  color:var(--muted);
  font-size:13px;
  font-weight:500;
}

@media(max-width:700px){
  .mode-switch{grid-template-columns:1fr 1fr}
  .mode-tab{font-size:14px}
}


/* ===== 五十音練習 ===== */
.mode-tab.active-kana{
  background:#f1eee4;
  border-color:#cfc4a4;
  color:#756641;
}

.kana-script{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:18px;
}

.kana-script-btn{
  min-height:48px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:#5f5147;
  font-family:inherit;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.kana-script-btn.active{
  background:#f4eedf;
  border-color:#cfc29f;
  color:#756641;
}

.kana-group{
  padding-top:16px;
}

.kana-group + .kana-group{
  border-top:1px solid #eee5d8;
  margin-top:18px;
}

.kana-group-title{
  margin:0 0 10px;
  color:#655b52;
  font-size:15px;
  font-weight:900;
}

.kana-special{
  grid-column:1 / -1;
}

.kana-choices{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  width:min(620px,100%);
  margin:18px auto 0;
}

.kana-choice{
  min-height:62px;
  border:1px solid #ddd7ca;
  border-radius:13px;
  background:#fff;
  color:#2d2a26;
  font-family:inherit;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  transition:background .15s,border-color .15s,transform .1s;
}

.kana-choice:hover{
  border-color:#caa57d;
  background:#fffaf4;
}

.kana-choice:active{
  transform:translateY(1px);
}

.kana-choice.correct{
  border-color:#9fbd91;
  background:#edf4e8;
  color:#4f6e48;
}

.kana-choice.wrong{
  border-color:#dca9a2;
  background:#fbeceb;
  color:#9d554d;
}

.kana-choice:disabled{
  cursor:default;
  opacity:1;
}

@media(max-width:700px){
  .mode-switch{grid-template-columns:1fr 1fr 1fr}
  .kana-script{grid-template-columns:1fr 1fr}
  .kana-choices{grid-template-columns:1fr 1fr}
}

@media(max-width:390px){
  .mode-switch{grid-template-columns:1fr}
  .kana-script{grid-template-columns:1fr}
  .kana-choices{grid-template-columns:1fr 1fr}
}


ruby{
  ruby-align:center;
  line-height:1.25;
}

ruby rt{
  font-size:.38em;
  line-height:1;
  color:#8a796b;
  font-weight:600;
}


.section-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.range-actions{
  display:flex;
  gap:8px;
}

.range-actions .level-toggle{
  min-height:36px;
  padding:6px 9px;
}

@media(max-width:390px){
  .section-title-row{
    align-items:flex-start;
  }
  .range-actions{
    gap:4px;
  }
  .range-actions .level-toggle{
    font-size:12px;
    padding:5px 7px;
  }
}

ruby{
  ruby-position:over;
  ruby-align:center;
  white-space:nowrap;
}

ruby rt{
  font-size:.34em;
  line-height:1;
  color:#8a796b;
  font-weight:600;
  letter-spacing:0;
}

</style>
</head>

<body>
<main class="app">
  <header class="header">
    <h1 class="title">日語練習</h1>
    <p class="subtitle">此為Kai老師製作，歡迎同學多加利用</p>
  </header>

  <!-- 設定 -->
  <section id="setupView" class="card">
    <div class="setting-block">
      <h2 class="section-title">練習模式</h2>
      <div class="mode-switch">
        <button type="button" class="mode-tab active-kana" id="kanaTabBtn">五十音練習</button>
        <button type="button" class="mode-tab" id="verbTabBtn">動詞變化</button>
        <button type="button" class="mode-tab" id="politeTabBtn">普通形・丁寧形</button>
      </div>
    </div>

    <div id="verbSetup">
      <div class="setting-block">
        <h2 class="section-title">起始形式</h2>
      <div class="option-grid">
        <label class="option">
          <input type="radio" name="startForm" value="ます形" checked>
          <span>ます形</span>
        </label>
        <label class="option">
          <input type="radio" name="startForm" value="辞書形">
          <span>辭書形</span>
        </label>
      </div>
    </div>

    <div class="setting-block">
      <h2 class="section-title">變化種類</h2>

      <div class="level-block">
        <div class="level-head">
          <span class="level-name n5">N5</span>
          <button type="button" class="level-toggle" data-level="N5">全選</button>
        </div>
        <div id="n5Options" class="option-grid"></div>
      </div>

      <div class="level-block">
        <div class="level-head">
          <span class="level-name n4">N4</span>
          <button type="button" class="level-toggle" data-level="N4">全選</button>
        </div>
        <div id="n4Options" class="option-grid"></div>
      </div>
    </div>

    <div class="setting-block">
      <h2 class="section-title">題數</h2>
      <div class="option-grid">
        <label class="option">
          <input type="radio" name="questionCount" value="10" checked>
          <span>10 題</span>
        </label>
        <label class="option">
          <input type="radio" name="questionCount" value="20">
          <span>20 題</span>
        </label>
        <label class="option">
          <input type="radio" name="questionCount" value="30">
          <span>30 題</span>
        </label>
      </div>
    </div>

      <div class="actions">
        <button type="button" class="btn" id="startBtn">開始練習</button>
        <button type="button" class="btn secondary" id="wrongBookBtn">📕 錯題本 <span id="wrongCount"></span></button>
      </div>

      <p class="note">題目會從所有動詞類型中綜合隨機出題。錯題會保存在此瀏覽器。</p>
    </div>

    <div id="politeSetup" class="hidden">
      <div class="setting-block">
        <h2 class="section-title">詞類</h2>
        <div class="option-grid compact-grid">
          <label class="option">
            <input type="checkbox" name="politeType" value="動詞" checked>
            <span>動詞</span>
          </label>
          <label class="option">
            <input type="checkbox" name="politeType" value="名詞" checked>
            <span>名詞</span>
          </label>
          <label class="option">
            <input type="checkbox" name="politeType" value="い形容詞" checked>
            <span>い形容詞</span>
          </label>
          <label class="option">
            <input type="checkbox" name="politeType" value="な形容詞" checked>
            <span>な形容詞</span>
          </label>
        </div>
      </div>

      <div class="setting-block">
        <h2 class="section-title">題數</h2>
        <div class="option-grid compact-grid">
          <label class="option">
            <input type="radio" name="politeCount" value="10" checked>
            <span>10 題</span>
          </label>
          <label class="option">
            <input type="radio" name="politeCount" value="20">
            <span>20 題</span>
          </label>
          <label class="option">
            <input type="radio" name="politeCount" value="30">
            <span>30 題</span>
          </label>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn" id="startPoliteBtn">開始練習</button>
        <button type="button" class="btn secondary" id="politeWrongBtn">📕 錯題本 <span id="wrongCount2"></span></button>
      </div>

function kanaToScript(char,script){
  if(script!=="katakana") return char;

  if(KANA_KATA[char]) return KANA_KATA[char];

  // 對於單字／短語形式的特殊音，逐字轉換平假名。
  return [...char].map(ch=>KANA_KATA[ch] || ch).join("");
}

function buildKanaPool(){
  const rows=[...document.querySelectorAll('input[name="kanaRow"]:checked')].map(el=>el.value);
  const includeSpecial=Boolean(document.querySelector('input[name="kanaSpecial"]:checked'));
  const script=document.querySelector(".kana-script-btn.active")?.dataset.script || "hiragana";
  const pool=[];

  for(const value of rows){
    const [section,rowName]=value.split("|");
    for(const raw of (KANA_ROWS[section]?.[rowName] || [])){
      pool.push({
        kind:"kana",
        display:kanaToScript(raw,script),
        answer:KANA_YOMI[raw],
        script,
        category:section,
        row:rowName
      });
    }
  }

  if(includeSpecial){
    for(const [category,raw,answer] of KANA_SPECIAL){
      pool.push({
        kind:"kana",
        display:script==="katakana" ? kanaToScript(raw,script) : raw,
        answer,
        script,
        category,
        row:"拗音・促音・長音"
      });
    }
  }

  return pool;
}

function kanaStem(answer){
  // 取得羅馬拼音前面的主要子音，讓干擾選項盡量相近。
  return answer.replace(/(ya|yu|yo|a|i|u|e|o)$/,"");
}

function getKanaDistractors(item,pool){
  const sameRow = pool.filter(x =>
    x.display !== item.display &&
    x.answer !== item.answer &&
    x.row === item.row &&
    x.category === item.category
  );

  const sameStem = pool.filter(x =>
    x.display !== item.display &&
    x.answer !== item.answer &&
    kanaStem(x.answer) === kanaStem(item.answer)
  );

  // 優先選同一行，再選同一發音系列，最後才用其他題目補足。
  let candidates = shuffle(sameRow);
  for(const x of shuffle(sameStem)){
    if(!candidates.some(y=>y.answer===x.answer)) candidates.push(x);
  }
  for(const x of shuffle(pool)){
    if(x.display!==item.display && x.answer!==item.answer &&
       !candidates.some(y=>y.answer===x.answer)){
      candidates.push(x);
    }
  }

  return candidates.slice(0,3);
}

function createKanaQuestions(pool,count){
  const shuffled=shuffle(pool);
  const selected=shuffled.slice(0,Math.min(count,shuffled.length));

  return selected.map(item=>{
    const direction=Math.random()<0.5 ? "kanaToRomaji" : "romajiToKana";

    if(direction==="kanaToRomaji"){
      const distractors=getKanaDistractors(item,pool).map(x=>x.answer);

      return {
        kind:"kana",
        item,
        direction,
        correctAnswer:item.answer,
        choices:shuffle([item.answer,...distractors])
      };
    }

    const distractors=getKanaDistractors(item,pool).map(x=>x.display);

    return {
      kind:"kana",
      item,
      direction,
      correctAnswer:item.display,
      choices:shuffle([item.display,...distractors])
    };
  });
}

function startKanaQuiz(customQuestions=null){
  if(customQuestions){
    currentMode="kana";
    questions=customQuestions.slice();
  }else{
    const pool=buildKanaPool();
    if(!pool.length){
      alert("請至少選擇一個五十音練習範圍。");
      return;
    }

    currentMode="kana";
    lastKanaScript=document.querySelector(".kana-script-btn.active")?.dataset.script || "hiragana";
    lastKanaCount=Number(document.querySelector('input[name="kanaCount"]:checked').value);
    questions=createKanaQuestions(pool,lastKanaCount);
  }

  current=0;
  correct=0;
  answered=false;
  showOnly(quizView);
  renderQuestion();
}

function shuffle(list){
  return list.slice().sort(() => Math.random() - .5);
}

function diversifyQuestions(list){
  for(let i=1;i<list.length;i++){
    const prev=list[i-1];
    if(list[i].verb.v===prev.verb.v || list[i].target===prev.target){
      for(let j=i+1;j<list.length;j++){
        if(list[j].verb.v!==prev.verb.v && list[j].target!==prev.target){
          [list[i],list[j]]=[list[j],list[i]];
          break;
        }
      }
    }
  }
  return list;
}


function startPoliteQuiz(){
  const types = [...document.querySelectorAll('input[name="politeType"]:checked')].map(el=>el.value);
  const count = Number(document.querySelector('input[name="politeCount"]:checked').value);

  if(!types.length){
    alert("請至少選擇一個詞類。");
    return;
  }

  const pool = POLITE_ITEMS.filter(item => types.includes(item.type));
  if(!pool.length){
    alert("目前沒有符合條件的題目。");
    return;
  }

  currentMode = "polite";
  lastPoliteTypes = types.slice();
  lastPoliteCount = count;

  questions = [];
  for(let i=0;i<count;i++){
    const item = pool[Math.floor(Math.random()*pool.length)];
    const index = Math.floor(Math.random()*4);
    const sourceIsNormal = Math.random() < 0.5;

    questions.push({
      kind:"polite",
      item,
      targetIndex:index,
      sourceStyle:sourceIsNormal ? "normal" : "polite",
      targetStyle:sourceIsNormal ? "polite" : "normal"
    });
  }

  current = 0;
  correct = 0;
  answered = false;

function startQuiz(customQuestions=null){
  if(!customQuestions) currentMode = "verb";
  const start = document.querySelector('input[name="startForm"]:checked').value;
  const forms = customQuestions ? null : getSelectedForms();

  if(!customQuestions && !forms.length){
    alert("請至少選擇一個變化種類。");
    return;
  }

  if(customQuestions){
    questions = customQuestions.slice();
  }else{
    lastStart = start;
    lastForms = forms.slice();
    lastCount = Number(document.querySelector('input[name="questionCount"]:checked').value);

    const candidates = [];
    for(const verb of VERBS){
      for(const target of forms){
        if(target !== start) candidates.push({verb,start,target});
      }
    }

    if(!candidates.length){
      alert("目前的變化種類與起始形式沒有可練習的組合，請至少選擇一個不同的變化種類。");
      return;
    }

    questions = [];
    const pool = shuffle(candidates);
    while(questions.length < Math.min(lastCount,pool.length)){
      const prev = questions[questions.length - 1];
      let idx = 0;
      if(prev){
        const better = pool.findIndex(q => q.verb.v !== prev.verb.v && q.target !== prev.target);
        if(better >= 0) idx = better;
      }
      questions.push(pool.splice(idx,1)[0]);
    }
  }

  current = 0;
  correct = 0;
  answered = false;

  showOnly(quizView);
  renderQuestion();
}

function renderQuestion(){
  const q = questions[current];

  $("questionNo").textContent = `第 ${current+1} / ${questions.length} 題`;
  $("currentScore").textContent = `答對 ${correct} 題`;
  $("progressBar").style.width = `${(current / questions.length) * 100}%`;

  const input=$("answerInput");
  const check=$("checkBtn");
  const choices=$("kanaChoices");

  if(q.kind === "kana"){
    input.classList.add("hidden");
    check.classList.add("hidden");
    choices.classList.remove("hidden");

    if(q.direction==="romajiToKana"){
      // 例如：kyo → きょ／きゃ／きゅ／きぉ
      $("questionVerb").textContent=q.item.answer;
      $("questionForm").textContent="請選擇正確假名";
    }else{
      // 例如：きょ → kyo／kya／kyu／kyo 類型的選項
      $("questionVerb").textContent=q.item.display;
      $("questionForm").textContent="請選擇正確羅馬拼音";
    }

    choices.innerHTML=q.choices.map(choice=>
      `<button type="button" class="kana-choice" data-answer="${escapeHtml(choice)}">${escapeHtml(choice)}</button>`
    ).join("");

    choices.querySelectorAll(".kana-choice").forEach(button=>{
      button.addEventListener("click",()=>checkKanaAnswer(button));
    });
  }else if(q.kind === "polite"){
    input.classList.remove("hidden");
    check.classList.remove("hidden");
    choices.classList.add("hidden");

    const sourceOptions = q.item.forms[q.sourceStyle][q.targetIndex];
    const source = q.shownSource || questionDisplay(sourceOptions);
    q.shownSource = source;

    const sourceOptionsList = getAnswerOptions(sourceOptions);
    const sourceIndex = Math.max(0, sourceOptionsList.indexOf(source));
    const readingOptions = q.item.readings[q.sourceStyle][q.targetIndex];
    const sourceReading = Array.isArray(readingOptions)
      ? readingOptions[sourceIndex] || readingOptions[0]
      : readingOptions;

    q.shownSourceReading = sourceReading;

    const targetLabel = q.targetStyle === "normal" ? "普通形" : "丁寧形";
    $("questionVerb").innerHTML = rubyText(source,sourceReading);
    $("questionForm").textContent = targetLabel;
  }else{
    input.classList.remove("hidden");
    check.classList.remove("hidden");
    choices.classList.add("hidden");

    const startWord = q.verb.f[q.start] || q.verb.f["辞書形"] || q.verb.v;
    const startReading = q.verb.r ? q.verb.r[q.start] : "";
    $("questionVerb").innerHTML = rubyText(startWord,startReading);
    $("questionForm").textContent = FORM_LABELS[q.target] || q.target;
  }

  input.value = "";
  input.disabled = false;
  check.disabled = false;

  $("feedback").className = "feedback hidden";
  $("feedback").innerHTML = "";

  answered = false;

  if(q.kind !== "kana"){
    setTimeout(() => input.focus(), 50);
  }
}

function normalizeAnswer(value){
  return value.trim().replace(/\s+/g,"");
}

function getAnswerOptions(answer){
  return Array.isArray(answer) ? answer : [answer];
}

function answerMatches(userAnswer, answer, readingAnswer=null){
  const normalized = normalizeAnswer(userAnswer);
  const accepted = getAnswerOptions(answer).map(normalizeAnswer);

  if(readingAnswer){
    accepted.push(...getAnswerOptions(readingAnswer).map(normalizeAnswer));
  }

  // 也接受片假名輸入的假名答案。
  accepted.push(...accepted.map(x=>toHiragana(x)));

  return accepted.includes(normalized) || accepted.includes(toHiragana(normalized));
}

function toHiragana(value){
  return String(value).replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
}

function answerDisplay(answer){
  return getAnswerOptions(answer).join("／");
}

function questionDisplay(answer){
  const options = getAnswerOptions(answer);
  return options[Math.floor(Math.random() * options.length)];
}


function checkKanaAnswer(button){
  if(answered) return;

  const q=questions[current];
  const userAnswer=button.dataset.answer;
  const rightAnswer=q.correctAnswer;

  answered=true;

  const buttons=[...$("kanaChoices").querySelectorAll(".kana-choice")];
  buttons.forEach(b=>b.disabled=true);

  if(userAnswer===rightAnswer){
    correct++;
    button.classList.add("correct");
    $("feedback").className="feedback ok";

    const source=q.direction==="romajiToKana" ? q.item.answer : q.item.display;
    $("feedback").innerHTML=`<strong>✓ 正確！</strong><br>
      ${escapeHtml(source)} → <strong>${escapeHtml(rightAnswer)}</strong>`;
  }else{
    button.classList.add("wrong");
    const correctButton=buttons.find(b=>b.dataset.answer===rightAnswer);
    if(correctButton) correctButton.classList.add("correct");

    $("feedback").className="feedback bad";

    const source=q.direction==="romajiToKana" ? q.item.answer : q.item.display;
    $("feedback").innerHTML=`<strong>✗ 答錯了</strong><br>
      你的答案：${escapeHtml(userAnswer)}<br>
      正確答案：<strong>${escapeHtml(rightAnswer)}</strong><br>
      <span>${escapeHtml(q.item.category)}　${escapeHtml(q.item.row)}</span>`;

    saveWrong({
      key:`kana||${q.item.script}||${q.item.display}||${q.direction}`,
      mode:"kana",
      verb:q.item.display,
      type:"五十音",
      script:q.item.script,
      category:q.item.category,
      row:q.item.row,
      direction:q.direction,
      user:userAnswer,
      answer:rightAnswer
    });
  }

  $("currentScore").textContent=`答對 ${correct} 題`;

  const stayMs = (q.kind === "verb" || q.kind === "polite")
    ? (answerMatches(userAnswer,rightAnswer,rightReading) ? 900 : 4000)
    : 900;

  setTimeout(()=>{
    if(current<questions.length-1){
      current++;
      renderQuestion();
    }else{
      finishQuiz();
    }
  },stayMs);
}

function checkAnswer(){
  if(answered) return;

  const q = questions[current];
  const userAnswer = normalizeAnswer($("answerInput").value);

  let rightAnswer;
  let rightReading = null;

  if(q.kind === "polite"){
    rightAnswer = q.item.forms[q.targetStyle][q.targetIndex];
    rightReading = q.item.readings ? q.item.readings[q.targetStyle][q.targetIndex] : null;
  }else{
    rightAnswer = q.verb.f[q.target];
    rightReading = q.verb.r ? q.verb.r[q.target] : null;
    if(!rightAnswer){
      alert("這一題的動詞資料不完整，請先返回設定。");
      return;
    }
  }

  if(!userAnswer){
    $("answerInput").focus();
    return;
  }

  answered = true;
  $("answerInput").disabled = true;
  $("checkBtn").disabled = true;

  if(answerMatches(userAnswer, rightAnswer, rightReading)){
    correct++;
    $("feedback").className = "feedback ok";
    const shownSource = q.kind === "polite"
      ? q.item.forms[q.sourceStyle][q.targetIndex]
      : q.verb.f[q.start];

    $("feedback").innerHTML =
      `<strong>✓ 正確！</strong><br>${escapeHtml(shownSource)} → <strong>${escapeHtml(rightAnswer)}</strong>`;
  }else{
    $("feedback").className = "feedback bad";

    if(q.kind === "polite"){
      const shownSource = q.item.forms[q.sourceStyle][q.targetIndex];
      $("feedback").innerHTML =
        `<strong>✗ 答錯了</strong><br>
         你的答案：${escapeHtml(userAnswer)}<br>
         正確答案：<strong>${escapeHtml(answerDisplay(rightAnswer))}</strong><br><span class="note">讀音：${escapeHtml(answerDisplay(rightReading || ""))}</span><br>
         <span>${escapeHtml(q.item.type)}</span>`;

      saveWrong({
        key:`polite||${q.item.word}||${q.targetIndex}`,
        mode:"polite",
        verb:q.item.word,
        type:q.item.type,
        sourceStyle:q.sourceStyle,
        targetStyle:q.targetStyle,
        targetIndex:q.targetIndex,
        user:userAnswer,
        answer:answerDisplay(rightAnswer)
      });
    }else{
      $("feedback").innerHTML =
        `<strong>✗ 答錯了</strong><br>
         你的答案：${escapeHtml(userAnswer)}<br>
         正確答案：<strong>${escapeHtml(answerDisplay(rightAnswer))}</strong><br>
         <span>${escapeHtml(q.verb.type)}</span>`;

      saveWrong({
        key: `${q.verb.v}||${q.target}`,
        mode:"verb",
        verb: q.verb.v,
        type: q.verb.type,
        start: q.start,
        target: q.target,
        user: userAnswer,
        answer: answerDisplay(rightAnswer)
      });
    }
  }

  $("currentScore").textContent = `答對 ${correct} 題`;

  const stayMs = answerMatches(userAnswer, rightAnswer, rightReading) ? 900 : 4000;

  setTimeout(() => {
    if(current < questions.length - 1){
      current++;
      renderQuestion();
    }else{
      finishQuiz();
    }
  }, stayMs);
}

function finishQuiz(){
  $("progressBar").style.width = "100%";
  $("resultTotal").textContent = questions.length;
  $("resultCorrect").textContent = correct;
  $("resultRate").textContent = `${Math.round(correct / questions.length * 100)}%`;
  updateWrongCount();
  showOnly(resultView);
}

function saveWrong(item){
  const list = getWrong();
  const existing = list.find(x => x.key === item.key);

  if(existing){
    existing.user = item.user;
    existing.answer = item.answer;
    existing.times = (existing.times || 1) + 1;
  }else{
    list.push({...item,times:1});
  }

  localStorage.setItem("verbWrongBook", JSON.stringify(list));
  updateWrongCount();
}

function getWrong(){
  try{
    return JSON.parse(localStorage.getItem("verbWrongBook") || "[]");
  }catch{
    return [];
  }
}

function updateWrongCount(){
  const n = getWrong().length;
  $("wrongCount").textContent = n ? `(${n})` : "";
  $("wrongCount2").textContent = n ? `(${n})` : "";
  $("wrongCount3").textContent = n ? `(${n})` : "";
}

function renderWrong(){
  const list = getWrong();
  const box = $("wrongContent");

  $("practiceWrongBtn").disabled = list.length === 0;
  $("clearWrongBtn").disabled = list.length === 0;

  if(!list.length){
    box.innerHTML = `<div class="empty">目前沒有錯題 🎉</div>`;
    return;
  }

  box.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>動詞</th>
            <th>變化</th>
            <th>你的答案</th>
            <th>正確答案</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(item => {
            const isKana = item.mode === "kana";
            const isPolite = item.mode === "polite";
            const formName = isKana
              ? `${item.script === "katakana" ? "片假名" : "平假名"}・${(item.direction === "romajiToKana" ? "羅馬拼音 → 假名" : "假名 → 羅馬拼音")}`
              : isPolite
                ? (item.targetStyle === "normal" ? "普通形" : "丁寧形")
                : (FORM_LABELS[item.target] || item.target);
            return `
              <tr>
                <td>
                  <strong>${escapeHtml(item.verb)}</strong><br>
                  <span class="badge">${escapeHtml(item.type)}</span>
                </td>
                <td>${escapeHtml(formName)}</td>
                <td>${escapeHtml(item.user)}</td>
                <td><strong>${escapeHtml(answerDisplay(item.answer))}</strong></td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function showWrong(){
  renderWrong();
  showOnly(wrongView);
}

function practiceWrong(){
  const list=getWrong();
  const convertedKana=[];
  const convertedPolite=[];
  const convertedVerb=[];

  for(const item of list){
    if(item.mode==="kana"){
      const direction=item.direction || "kanaToRomaji";
      const correctAnswer=item.answer;

      convertedKana.push({
        kind:"kana",
        item:{
          display:item.verb,
          answer: direction==="romajiToKana" ? correctAnswer : correctAnswer,
          script:item.script || "hiragana",
          category:item.category || "五十音",
          row:item.row || ""
        },
        direction,
        correctAnswer,
        choices:[correctAnswer]
      });
    }else if(item.mode==="polite"){
      const source=POLITE_ITEMS.find(x=>x.word===item.verb && x.type===item.type);
      if(source){
        convertedPolite.push({
          kind:"polite",
          item:source,
          targetIndex:item.targetIndex,
          sourceStyle:item.sourceStyle,
          targetStyle:item.targetStyle
        });
      }
    }else{
      const verb=VERBS.find(v=>v.v===item.verb);
      if(verb){
        convertedVerb.push({
          kind:"verb",
          verb,
          start:item.start,
          target:item.target
        });
      }
    }
  }

  if(!convertedKana.length && !convertedPolite.length && !convertedVerb.length){
    alert("目前錯題本裡沒有可重新練習的題目。");
    return;
  }

  if(convertedKana.length){
    const allKana=buildKanaPool();
    const rebuilt=convertedKana.map(q=>{
      if(q.direction==="romajiToKana"){
        const others=shuffle(allKana.filter(x=>x.display!==q.item.display)).slice(0,3).map(x=>x.display);
        return {
          kind:"kana",
          item:q.item,
          direction:"romajiToKana",
          correctAnswer:q.item.display,
          choices:shuffle([q.item.display,...others])
        };
      }

      const others=shuffle(allKana.filter(x=>x.answer!==q.item.answer)).slice(0,3).map(x=>x.answer);
      return {
        kind:"kana",
        item:q.item,
        direction:"kanaToRomaji",
        correctAnswer:q.item.answer,
        choices:shuffle([q.item.answer,...others])
      };
    });
    currentMode="kana";
    startKanaQuiz(rebuilt);
  }else if(convertedPolite.length){
    currentMode="polite";
    startQuiz(convertedPolite);
  }else{
    currentMode="verb";
    startQuiz(convertedVerb);
  }
}

function clearWrong(){
  if(!confirm("確定要清空全部錯題嗎？")) return;
  localStorage.removeItem("verbWrongBook");
  renderWrong();
  updateWrongCount();
}


function rubyText(display,reading){
  if(!reading) return escapeHtml(display);

  const text=[...String(display)];
  const kana=[...String(reading)];
  const isKanji=ch=>/[\u3400-\u9fff]/.test(ch);
  const isKana=ch=>/[\u3040-\u30ffー]/.test(ch);

  if(!text.some(isKanji)) return escapeHtml(display);

  let ri=0;
  let result="";
  let kanjiBuffer="";
  let readingStart=0;

  const flushKanji=(readingEnd)=>{
    if(!kanjiBuffer) return;
    const r=kana.slice(readingStart,readingEnd).join("");
    result += `<ruby>${escapeHtml(kanjiBuffer)}<rt>${escapeHtml(r || kanjiBuffer)}</rt></ruby>`;
    kanjiBuffer="";
  };

  for(const ch of text){
    if(isKanji(ch)){
      if(!kanjiBuffer) readingStart=ri;
      kanjiBuffer+=ch;
      continue;
    }

    if(isKana(ch)){
      let match=-1;

      // 在讀音中尋找目前顯示文字的假名作為邊界。
      for(let j=ri;j<kana.length;j++){
        if(kana[j]===ch){
          match=j;
          break;
        }
      }

      if(match>=0){
        flushKanji(match);
        result+=escapeHtml(ch);
        ri=match+1;
      }else{
        flushKanji(ri);
        result+=escapeHtml(ch);
      }
      continue;
    }

    flushKanji(ri);
    result+=escapeHtml(ch);
  }

  flushKanji(kana.length);
  return result;
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document.querySelectorAll(".level-toggle").forEach(button => {
  button.addEventListener("click", () => {
    const level = button.dataset.level;
    const forms = FORM_GROUPS[level];

    const boxes = forms.map(form =>
      document.querySelector(`input[name="targetForm"][value="${form}"]`)
    );

    const allChecked = boxes.every(box => box && box.checked);
    boxes.forEach(box => {
      if(box) box.checked = !allChecked;
    });

    button.textContent = allChecked ? "全選" : "取消全選";
  });
});

function switchMode(mode){
  const verb = mode === "verb";
  const polite = mode === "polite";
  const kana = mode === "kana";

  $("verbSetup").classList.toggle("hidden", !verb);
  $("politeSetup").classList.toggle("hidden", !polite);
  $("kanaSetup").classList.toggle("hidden", !kana);

  $("verbTabBtn").classList.toggle("active-verb", verb);
  $("politeTabBtn").classList.toggle("active-polite", polite);
  $("kanaTabBtn").classList.toggle("active-kana", kana);
}

$("politeTabBtn").addEventListener("click", () => switchMode("polite"));
$("kanaTabBtn").addEventListener("click", () => switchMode("kana"));

$("startPoliteBtn").addEventListener("click", () => startPoliteQuiz());
$("politeWrongBtn").addEventListener("click", showWrong);
$("startKanaBtn").addEventListener("click", () => startKanaQuiz());
$("kanaWrongBtn").addEventListener("click", showWrong);

document.querySelectorAll(".kana-script-btn").forEach(button=>{
  button.addEventListener("click",()=>{
    document.querySelectorAll(".kana-script-btn").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
  });
});

$("startBtn").addEventListener("click", () => startQuiz());
$("checkBtn").addEventListener("click", checkAnswer);

$("answerInput").addEventListener("keydown", event => {
  if(event.key === "Enter") checkAnswer();
});

$("quitBtn").addEventListener("click", () => {
  showOnly(setupView);
});

$("wrongBookBtn").addEventListener("click", showWrong);
$("resultWrongBtn").addEventListener("click", showWrong);
$("wrongBackBtn").addEventListener("click", () => showOnly(setupView));
$("resultBackBtn").addEventListener("click", () => showOnly(setupView));

$("againBtn").addEventListener("click", () => {
  if(currentMode === "polite"){
    document.querySelectorAll('input[name="politeType"]').forEach(el => {
      el.checked = lastPoliteTypes.includes(el.value);
    });
    const countRadio = document.querySelector('input[name="politeCount"][value="' + lastPoliteCount + '"]');
    if(countRadio) countRadio.checked = true;
    startPoliteQuiz();
    return;
  }

  if(currentMode === "kana"){
    document.querySelectorAll(".kana-script-btn").forEach(el => {
      el.classList.toggle("active", el.dataset.script === lastKanaScript);
    });
    const countRadio = document.querySelector('input[name="kanaCount"][value="' + lastKanaCount + '"]');
    if(countRadio) countRadio.checked = true;
    startKanaQuiz();
    return;
  }

  const selected = document.querySelector('input[name="startForm"][value="' + lastStart + '"]');
  if(selected) selected.checked = true;

  document.querySelectorAll('input[name="targetForm"]').forEach(el => {
    el.checked = lastForms.includes(el.value);
  });

  startQuiz();
});

$("practiceWrongBtn").addEventListener("click", practiceWrong);
$("clearWrongBtn").addEventListener("click", clearWrong);

renderFormOptions();
renderKanaRows();
updateWrongCount();
switchMode("kana");
</script>
